name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Capacitor Android
        working-directory: web
        run: npm install @capacitor/android

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Add Android platform
        working-directory: web
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: web
        run: npx cap sync android

      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Get version
        id: version
        working-directory: web
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Chapter v${{ steps.version.outputs.VERSION }}
          body: |
            ## Chapter v${{ steps.version.outputs.VERSION }}

            Tu lector de historias favorito.

            ### Formatos soportados
            - PDF
            - Word (.docx)
            - PowerPoint (.pptx)
            - EPUB
            - Imágenes (JPG, PNG, WebP, GIF)

            ### Funcionalidades
            - Conversión 100% client-side (sin servidor)
            - Efecto de giro de página realista (cuero)
            - Editor de portada personalizable
            - Marcadores por libro
            - Lectura offline
            - Paletas de colores intercambiables
            - Tipografía elegante cursive
          files: web/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
